services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eduma
      POSTGRES_USER: eduma
      POSTGRES_PASSWORD: eduma
    # 5434 on this machine, so it can run next to the MTO (5432) and Student Connect (5433) databases.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduma -d eduma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
